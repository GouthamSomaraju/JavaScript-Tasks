<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./trolley.png" type="image/x-icon">
    <title>Cart</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
      }

      #cart {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-bottom: 30px;
      }

      .card {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 10px;
        width: 250px;
        border: 2px solid #21f380;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        transition: transform 0.2s;
      }

      .card:hover {
        transform: scale(1.03);
      }
      .card img {
        width: 100%;
        height: 180px;
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: 15px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .card h1 {
        font-size: 20px;
        margin-bottom: 10px;
        color: #333;
      }

      .card h2 {
        font-size: 18px;
        color: #666;
      }
      .card span {
        font-size: 18px;
        font-weight: bold;
        color: #666;
      }

      #total {
        text-align: center;
      }

      #total h3 {
        font-size: 24px;
        color: #333;
        margin-bottom: 15px;
      }

      #total button {
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bolder;
        background-color: #ffa217;
        color: Black;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      #total button:hover {
        background-color: #f8ac3a;
      }
    </style>
  </head>
  <body>
    <div id="cart"></div>
    <div id="total"></div>

    <script>
      let data = JSON.parse(sessionStorage.getItem("data"));
      let totalAmount = 0;
      // console.log(data);

      if (data.length > 0) {
        data.map((val) => {
          let cart = document.getElementById("cart");
          let card = document.createElement("div");
          let image=document.createElement("img")
          let h1 = document.createElement("h1");
          let h2 = document.createElement("h2");
          let dis = document.createElement("span");

          card.className = "card";

          image.src=val.image
          h1.innerHTML = val.name;
          h2.innerHTML = "Rs." + val.cost;
          dis.innerHTML = `Discount: ${val.discount * 100}%`;

          totalAmount += val.cost - val.cost * val.discount;
          console.log(totalAmount);

          card.append(image,h1, h2, dis);
          cart.appendChild(card);
        });

        let total = document.getElementById("total");
        let h3 = document.createElement("h3");
        let btn = document.createElement("button");

        h3.innerHTML = `Total Price: Rs.${totalAmount}`;
        btn.innerHTML = "BUY";
        btn.addEventListener("click", function () {
          alert(`Total Price: Rs.${totalAmount}`);
        });

        total.append(h3, btn);
      } else {
        document.getElementById("cart").innerHTML = "Your Cart is Empty";
      }
    </script>
  </body>
</html>
