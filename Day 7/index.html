<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini User Tracker App</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    #reset { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1 id="greeting"></h1>
  <button id="reset">Reset</button>
  <script>
    // 1. Polyfill for Array.prototype.includes
if (!Array.prototype.includes) {
  Array.prototype.includes = function(searchElement, fromIndex = 0) {
    for (let i = fromIndex; i < this.length; i++) {
      if (this[i] === searchElement) return true;
    }
    return false;
  };
}

// 2. Prototypal Inheritance
function User(name) {
  this.name = name;
}

function Visitor(name, visitCount) {
  User.call(this, name);
  this.visitCount = visitCount;
}

Visitor.prototype = Object.create(User.prototype);
Visitor.prototype.constructor = Visitor;

// 3. Cookie utilities
function setCookie(name, value, daysToExpire = 7) {
  const expires = new Date(Date.now() + daysToExpire * 864e5).toUTCString();
  document.cookie = `${name}=${value}; expires=${expires}; path=/`;
}

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

function deleteCookie(name) {
  document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
}

// 4. Suffix function for ordinal numbers
function getOrdinalSuffix(n) {
  const s = ["th", "st", "nd", "rd"],
    v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// 5. Main App Logic
function runApp() {
  let name = localStorage.getItem('username');
  if (!name) {
    name = prompt("Enter your name:");
    if (name) localStorage.setItem('username', name);
  }

  if (name) {
    let visitCount = parseInt(getCookie('visitCount') || '0', 10);
    visitCount += 1;
    setCookie('visitCount', visitCount);

    const visitor = new Visitor(name, visitCount);
    document.getElementById('greeting').textContent = `Hello ${visitor.name}, this is your ${getOrdinalSuffix(visitor.visitCount)} visit!`;
  }
}

// 6. Reset Button
document.getElementById('reset').addEventListener('click', () => {
  localStorage.removeItem('username');
  deleteCookie('visitCount');
  location.reload();
});

// Run the app on load
runApp();

  </script>
</body>
</html>
